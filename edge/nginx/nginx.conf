events {}

http {

    upstream lattice_web {
        server lattice-test-web-a:80;
        server lattice-test-web-b:80;
    }

    # Reject unknown hostnames
    server {
        listen 80 default_server;
        server_name _;

        return 404;
    }

    # Known Lattice hostname
    server {
        listen 80;
        server_name www.lattice.test;

        location / {
            proxy_pass http://lattice_web;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
