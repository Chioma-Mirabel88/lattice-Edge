# Lattice WAF - Version 0.2

# --------------------------------------------------
# SQL Injection Detection
# --------------------------------------------------

if ($request_uri ~* "(union.*select|select.*from|insert.*into|drop.*table|delete.*from)") {
    return 403;
}

# --------------------------------------------------
# Cross-Site Scripting Detection
# --------------------------------------------------

if ($request_uri ~* "(<script|javascript:|onerror=|onload=)") {
    return 403;
}

# --------------------------------------------------
# Path Traversal Detection
# --------------------------------------------------

if ($request_uri ~* "(\.\./|\.\.%2f|%2e%2e%2f|%2e%2e/)") {
    return 403;
}
